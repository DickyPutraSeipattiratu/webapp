name: DevSecOps Pipeline
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    needs: gitleaks
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Semgrep Scan
        run: |
          docker run --rm -v "$PWD:/src" returntocorp/semgrep semgrep --config=auto --error

  trivy-file:
    needs: semgrep
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Trivy Config Scan
        uses: aquasecurity/trivy-action@<SHA_yang_Anda_Dapatkan> # 0.28.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  build:
    needs: trivy-file
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build Docker Image
        run: docker build -t webapp:${{ github.sha }} .

  trivy-image:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@<SHA_yang_Anda_Dapatkan> # 0.28.0
        with:
          image-ref: 'webapp:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  deploy:
    needs: trivy-image
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          docker stop webapp || true
          docker rm webapp || true
          docker run -d --name webapp -p 8081:80 webapp:${{ github.sha }}
